name: Deploy to GitHub Pages & Package Windows Distribution

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-package-deploy:
    name: Build Vite, Package Windows Zip & Deploy Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Vite Production Web App
        run: npm run build
        env:
          NODE_ENV: production

      - name: Package Windows Zip-Ready Executable Distribution
        run: node scripts/package-win-dist.js

      - name: Upload Windows Distribution Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RecompStation-Windows-x64-Zip
          path: |
            release/RecompStation-Windows-x64.zip
            release/SHA256SUMS.txt
          retention-days: 30

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
